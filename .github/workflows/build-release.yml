name: build-release

# tcl 分支一有变化就构建、用我们的密钥签名，然后把 APK 和 version.txt
# 发布到 release 分支。电视上的 Aerial 从 GitHub Pages 拉这两个文件。
#
# 这个分支是「雷鸟/TCL 专用版」，由本人维护，不自动跟上游。
# 想合上游的新版本时，在本地手动 merge，解完冲突再 push 到这里。
#
# 需要以下 repository secrets（Settings → Secrets and variables → Actions）：
#   AERIAL_KEYSTORE_BASE64   local/aerial.keystore 的 base64
#   AERIAL_STORE_PASSWORD    keystore 口令
#   AERIAL_KEY_ALIAS         密钥别名
#   AERIAL_KEY_PASSWORD      密钥口令
# 生成 base64：
#   base64 -w0 local/aerial.keystore

on:
  push:
    branches: [tcl]
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "tools/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tcl
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        # android-actions/setup-android@v3 asks for the retired "tools" package by default, and its
        # multi-line "packages" input did not parse here either. Installing it by hand is duller
        # but reliable.
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          # The runner image also exports ANDROID_SDK_ROOT to its own preinstalled SDK; two
          # different paths make AGP refuse to run, so point it here too.
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: signing key
        env:
          KEYSTORE_B64: ${{ secrets.AERIAL_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AERIAL_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AERIAL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 secrets.AERIAL_KEYSTORE_BASE64，没有它构建会用 debug 密钥签名，电视收不到更新。"
            exit 1
          fi
          mkdir -p local
          echo "$KEYSTORE_B64" | base64 -d > local/aerial.keystore
          {
            echo "storeFile=aerial.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > local/signing.properties

      - name: build
        run: |
          chmod +x gradlew
          ./gradlew assembleStandardRelease --no-daemon --stacktrace

      - name: publish to release branch
        run: |
          APK=app/build/outputs/apk/standard/release/app-standard-release.apk
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"([0-9.]+)".*/\1/')
          test -s "$APK" || { echo "::error::APK 没生成"; exit 1; }
          # Keep the APK outside the repo: the orphan switch below clears the working tree.
          cp "$APK" /tmp/aerial-release.apk
          echo "version=$VERSION size=$(stat -c%s /tmp/aerial-release.apk)"

          git config user.name  "HalfBilt"
          git config user.email "HalfBilt@users.noreply.github.com"
          git switch --orphan release-tmp
          git reset --hard
          git rm -rq --cached . >/dev/null 2>&1 || true
          rm -rf .github app lite gradle docs site tools *.md *.kts gradlew* 2>/dev/null || true
          cp /tmp/aerial-release.apk aerial-standard.apk
          printf '%s\n' "$VERSION" > version.txt
          git add aerial-standard.apk version.txt
          git commit -q -m "release $VERSION"
          git push -f origin release-tmp:release
          echo "published: version=$VERSION"
